<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tiffin Manager promo</title>
<style>
  :root { --brand: #e8590c; --brand2: #f59f00; --ink: #2a2016; --muted: #7c6b58; }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: #fff7ea; overflow: hidden; }
  body { font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  #canvas { position: relative; overflow: hidden; background: linear-gradient(160deg, #fff6e8, #ffe6c7 55%, #ffd9ab); }
  .blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: .55; }
  #b1 { width: 700px; height: 700px; background: #ffc078; }
  #b2 { width: 600px; height: 600px; background: #ffe066; }
  #orange { position: absolute; inset: 0; background: linear-gradient(145deg, #f76707, #f59f00); opacity: 0; }
  #orange::after { content: "🍱"; position: absolute; right: -120px; bottom: -160px; font-size: 900px; opacity: .13; transform: rotate(-12deg); }
  #brand { position: absolute; display: flex; align-items: center; gap: 16px; font-weight: 800; letter-spacing: -.02em; }
  #brand img { border-radius: 14px; }

  #cap { position: absolute; }
  #cap h1 { font-weight: 900; letter-spacing: -.035em; line-height: 1.05; }
  #cap h1 em, .gradtxt { font-style: normal; background: linear-gradient(120deg, var(--brand), var(--brand2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #cap .step { display: none; width: max-content; padding: 8px 24px; border-radius: 99px; background: linear-gradient(120deg, var(--brand), var(--brand2)); color: #fff; font-weight: 800; letter-spacing: .1em; margin-bottom: 16px; }
  #prog { position: absolute; left: 0; top: 0; height: 10px; width: 0; background: linear-gradient(90deg, var(--brand), var(--brand2)); z-index: 5; opacity: 0; }
  #cap p { color: var(--muted); font-weight: 600; margin-top: 18px; line-height: 1.3; }

  #phone { position: absolute; background: #1f1810; box-shadow: 0 50px 100px rgba(120, 60, 0, .35), inset 0 0 0 3px #3a2f22; }
  #screen { position: relative; overflow: hidden; background: #fff7ea; }
  .shot { position: absolute; left: 0; top: 0; width: 780px; height: 1688px; transform-origin: 0 0; opacity: 0; }
  .shot img { position: absolute; inset: 0; width: 780px; height: 1688px; }
  .touch { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; background: rgba(40, 25, 10, .28); opacity: 0; }
  .ripple { position: absolute; width: 140px; height: 140px; margin: -70px 0 0 -70px; border-radius: 50%; border: 10px solid rgba(255, 255, 255, .95); box-shadow: 0 0 0 6px rgba(232, 89, 12, .55); opacity: 0; }
  .ring { position: absolute; border-radius: 34px; border: 8px solid var(--brand); box-shadow: 0 0 0 10px rgba(245, 159, 0, .28); opacity: 0; }
  .toast { position: absolute; left: 50%; bottom: 210px; transform: translateX(-50%); padding: 26px 40px; border-radius: 30px; background: #2a2016; color: #fff; font: 700 34px/1.3 Inter, sans-serif; text-align: center; width: 640px; opacity: 0; }

  .float { position: absolute; opacity: 0; background: #fff; border-radius: 32px; box-shadow: 0 30px 70px rgba(80, 40, 0, .28); padding: 26px 32px; }
  .tg { border-left: 12px solid #2aabee; }
  .tg .hd { font-weight: 800; color: #1b8bc9; margin-bottom: 10px; }
  .tg .ln { line-height: 1.4; font-weight: 500; }
  .tg .ln b { font-weight: 800; }
  .chip { display: grid; gap: 4px; justify-items: start; }
  .chip small { font-weight: 700; color: var(--muted); }
  .chip .nums { display: flex; align-items: center; gap: 22px; font-weight: 900; letter-spacing: -.03em; }
  .chip .old { color: #b8a58f; text-decoration: line-through; }
  .chip .arrow { color: var(--brand); }
  .chip .new { color: var(--brand); }

  #hook, #cta { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; text-align: center; color: #fff; opacity: 0; padding: 0 90px; }
  #hook .em, #cta .em { line-height: 1; }
  #hook h1, #cta h1 { font-weight: 900; letter-spacing: -.04em; line-height: 1.04; }
  #hook p, #cta p { font-weight: 600; opacity: .95; margin-top: 26px; }
  #cta .url { margin-top: 44px; padding: 22px 52px; border-radius: 99px; background: #fff; color: var(--brand); font-weight: 900; letter-spacing: -.01em; box-shadow: 0 24px 60px rgba(0, 0, 0, .2); }
  #cta img { border-radius: 28%; box-shadow: 0 24px 60px rgba(0, 0, 0, .2); }
</style>
</head>

const lerp = (a, b, k) => a + (b - a) * k;

  ? { Sw: 700, bez: 14, px: Math.round((W - 728) / 2), py: 415, cap: { x: 80, y: 105, w: 920, fs: 74, sub: 38 }, brand: { x: 60, y: 44, fs: 36, ic: 56 },

  D = defs();
  $('#hook .em').textContent = D.hook.em; $('#hook h1').innerHTML = D.hook.title; $('#hook p').textContent = D.hook.sub;
  $('#cta h1').innerHTML = D.cta.title; $('#cta p').textContent = D.cta.sub; if (D.cta.url) $('#cta .url').textContent = D.cta.url;
  for (const s of D.shots) {
    const el = document.createElement('div'); el.className = 'shot';
    const img = new Image(); img.src = `assets/${s.src}.png`; el.append(img);
    s.fx = [];
    for (const [t, x, y] of s.tap || []) {
      const touch = Object.assign(document.createElement('div'), { className: 'touch' }), rip = Object.assign(document.createElement('div'), { className: 'ripple' });
      touch.style.left = rip.style.left = `${x}px`; touch.style.top = rip.style.top = `${y}px`; el.append(touch, rip); s.fx.push({ type: 'tap', t, touch, rip });
    }
    for (const [a, b, box] of s.rings || []) {
      const ring = Object.assign(document.createElement('div'), { className: 'ring' });
      Object.assign(ring.style, { left: `${box[0] - 14}px`, top: `${box[1] - 12}px`, width: `${box[2] + 28}px`, height: `${box[3] + 24}px` }); el.append(ring); s.fx.push({ type: 'ring', a, b, ring });
    }
    if (s.toast) { const t = Object.assign(document.createElement('div'), { className: 'toast', textContent: s.toast[2] }); el.append(t); s.fx.push({ type: 'toast', a: s.toast[0], b: s.toast[1], el: t }); }
    screen.append(el); s.el = el;
  }
  for (const f of D.floats) {
    const el = document.createElement('div'); el.className = `float ${f.kind === 'bubble' ? 'tg' : 'chip'}`;
    if (f.kind === 'bubble') { el.innerHTML = f.html; Object.assign(el.style, { left: `${LAY.bubble.x}px`, top: `${LAY.bubble.y}px`, width: `${LAY.bubble.w}px`, fontSize: `${LAY.bubble.fs}px` }); }
    else { el.innerHTML = `<small>${f.label}</small><div class="nums"><span class="old">${f.from}</span><span class="arrow">→</span><span class="new">${f.from}</span></div>`; Object.assign(el.style, { left: `${LAY.chip.x}px`, top: `${LAY.chip.y}px`, fontSize: '36px' }); el.querySelector('.nums').style.fontSize = `${LAY.chip.fs}px`; }
    canvas.append(el); f.el = el;
  }
}

function camAt(s, t) {
  const k = s.cam; let i = 0;
  while (i < k.length - 1 && t >= k[i + 1][0]) i++;
  const a = k[i], b = k[Math.min(i + 1, k.length - 1)];
  const e = a === b ? 0 : ease.inout(P(t, a[0], b[0]));
  return { fx: lerp(a[1], b[1], e), fy: lerp(a[2], b[2], e), z: lerp(a[3], b[3], e) };
}

function seek(t) {
  // background drift
  $('#b1').style.transform = `translate(${Math.sin(t * .5) * 90}px, ${Math.cos(t * .4) * 70}px)`;
  $('#b2').style.transform = `translate(${Math.cos(t * .45) * 80}px, ${Math.sin(t * .35) * 80}px)`;

  // hook
  const h = D.hook, hv = t < h.b ? ease.out(P(t, h.a, h.a + .35)) : 1 - ease.in(P(t, h.b - .05, h.b + .35));
  const hookOn = t < h.b + .4;
  $('#hook').style.opacity = hookOn ? hv : 0;
  $('#hook').style.transform = `scale(${lerp(.94, 1, ease.out(P(t, h.a, h.a + .6)))})`;
  $('#hook .em').style.transform = `translateY(${Math.sin(t * 6) * 10}px) rotate(${Math.sin(t * 4) * 4}deg)`;

  // cta
  const c = D.cta, cv = ease.out(P(t, c.a, c.a + .5));
  $('#cta').style.opacity = cv; $('#cta').style.transform = `scale(${lerp(.94, 1, cv)})`;
  $('#orange').style.opacity = Math.min(1, (hookOn ? hv : 0) + cv);

  $('#prog').style.opacity = D.progress ? 1 : 0; $('#prog').style.width = `${clamp(t / D.dur) * W}px`;
  // brand + caption + phone visibility
  const phoneWin = D.phone[0];
  const inP = ease.out(P(t, phoneWin[0], phoneWin[0] + .9)), outP = ease.in(P(t, phoneWin[1], phoneWin[1] + .6));
  const off = (1 - inP) + outP;
  const slide = V ? H - LAY.py + 60 : W - LAY.px + 60;
  phone.style.transform = V ? `translateY(${off * slide}px) rotate(${(1 - inP) * 3}deg)` : `translateX(${off * slide}px) rotate(${(1 - inP) * 3}deg)`;
  const showUI = Math.min(inP, 1 - outP);
  $('#brand').style.opacity = showUI;

  // captions
  const idx = D.caps.findIndex((c2) => t >= c2[0] && t < c2[1]);
  const capEl = $('#cap');
  if (idx !== capIdx) { capIdx = idx; if (idx >= 0) { $('#cap h1').innerHTML = D.caps[idx][2]; $('#cap p').textContent = D.caps[idx][3]; const st = $('#cap .step'); st.textContent = D.caps[idx][4] || ''; st.style.display = D.caps[idx][4] ? 'block' : 'none'; } }
  if (idx >= 0) {
    const [a, b] = D.caps[idx], pin = ease.out(P(t, a, a + .5)), pout = ease.in(P(t, b - .35, b));
    capEl.style.opacity = pin * (1 - pout);
    capEl.style.transform = `translateY(${(1 - pin) * 50 - pout * 24}px)`;
  } else capEl.style.opacity = 0;

  // shots
  for (const s of D.shots) {
    const vis = Math.min(P(t, s.a, s.a + .3), 1 - P(t, s.b - .3, s.b));
    s.el.style.opacity = vis;
    if (vis <= 0) continue;
    const cam = camAt(s, clamp(t, s.cam[0][0], 1e9)), z = K * cam.z;
    let tx = LAY.Sw / 2 - cam.fx * z, ty = LAY.Sh / 2 - cam.fy * z;
    tx = clamp(tx, LAY.Sw - 780 * z, 0); ty = clamp(ty, LAY.Sh - 1688 * z, 0);
    s.el.style.transform = `translate(${tx}px, ${ty}px) scale(${z})`;
    for (const f of s.fx) {
      if (f.type === 'tap') {
        const d = t - f.t;
        f.touch.style.opacity = d > -.45 && d < .25 ? (d < -.3 ? P(d, -.45, -.3) : 1 - P(d, .1, .25)) : 0;
        f.touch.style.transform = `scale(${d < 0 ? 1.15 : lerp(.8, 1, P(d, 0, .2))})`;
        const r = P(t, f.t, f.t + .75);
        f.rip.style.opacity = r > 0 && r < 1 ? (1 - r) * .95 : 0; f.rip.style.transform = `scale(${lerp(.3, 2.1, ease.out(r))})`;
      } else if (f.type === 'ring') {
        const o = Math.min(P(t, f.a, f.a + .3), 1 - P(t, f.b - .3, f.b));
        f.ring.style.opacity = o; f.ring.style.transform = `scale(${1 + Math.sin((t - f.a) * 7) * .012})`;
      } else if (f.type === 'toast') {
        const o = Math.min(ease.out(P(t, f.a, f.a + .35)), 1 - P(t, f.b - .3, f.b));
        f.el.style.opacity = o; f.el.style.transform = `translateX(-50%) translateY(${(1 - o) * 40}px)`;
      }
    }
  }

  // floating cards
  for (const f of D.floats) {
    const o = Math.min(ease.back(P(t, f.a, f.a + .6)), 1 - P(t, f.b - .4, f.b));
    f.el.style.opacity = clamp(o, 0, 1);
    f.el.style.transform = `translateY(${(1 - clamp(o, 0, 1)) * 70}px) scale(${.96 + .04 * clamp(o, 0, 1)})`;
    if (f.kind === 'count') {
      const flipped = t >= f.flip, pop = 1 + Math.sin(P(t, f.flip, f.flip + .4) * Math.PI) * .18;
      const nums = f.el.querySelector('.nums');
      nums.innerHTML = flipped ? `<span class="old">${f.from}</span><span class="arrow">→</span><span class="new" style="display:inline-block;transform:scale(${pop})">${f.to}</span>` : `<span class="new">${f.from}</span>`;
    }
  }
}

window.ready = Promise.all([fetch('assets/meta.json').then((r) => r.json()), fetch('assets/meta-howto.json').then((r) => (r.ok ? r.json() : { boxes: {} }))]).then(async ([m, h]) => {
  M = { ...m, boxes: { ...m.boxes, ...h.boxes } }; build();
  await Promise.all([...document.images].map((i) => i.decode().catch(() => {})));
  await document.fonts.ready;
  window.DURATION = D.dur; window.W = W; window.H = H;
  seek(0);
  return { dur: D.dur, W, H };
});
window.seek = seek;
</script>
