<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <title>Log in – Tiffin Manager</title>
  <meta name="theme-color" content="#e8590c">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/site.css">
</head>
<body>
  <div class="auth">
    <aside class="auth-side">
      <a class="brand" href="/"><img src="/icon.svg" alt="">Tiffin Manager</a>
      <div>
        <h2>The right number of tiffins, every day.</h2>
        <ul><li>🍱 See today’s box count at a glance</li><li>🏖 Customers mark their own leave</li><li>✈️ Instant Telegram alerts</li></ul>

      <span></span>

    <main class="auth-main">
      <div class="auth-box" id="box"></div>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/login.js"></script>

</html>
