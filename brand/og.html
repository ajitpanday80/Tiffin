<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; position: relative; font-family: Inter, system-ui, sans-serif; color: #2a2016;
         background: linear-gradient(150deg, #fff7ea, #ffe6c7 60%, #ffd9ab); }
  .blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .6; }
  .b1 { width: 520px; height: 520px; background: #ffc078; right: -80px; top: -140px; }
  .b2 { width: 380px; height: 380px; background: #ffe066; left: -100px; bottom: -160px; opacity: .45; }
  .logo { position: absolute; left: 72px; top: 60px; height: 78px; }
  h1 { position: absolute; left: 72px; top: 164px; width: 640px; font-size: 68px; line-height: 1.04; letter-spacing: -.035em; font-weight: 900; }
  h1 em { font-style: normal; background: linear-gradient(120deg, #e8590c, #f59f00); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p { position: absolute; left: 72px; top: 388px; width: 600px; font-size: 28px; line-height: 1.3; font-weight: 600; color: #7c6b58; }
  .url { position: absolute; left: 72px; top: 506px; padding: 14px 30px; border-radius: 99px; background: linear-gradient(135deg, #f76707, #f59f00); color: #fff; font-size: 32px; font-weight: 800; letter-spacing: -.01em; box-shadow: 0 14px 34px rgba(232, 89, 12, .35); }
  .phone { position: absolute; left: 790px; top: 70px; width: 340px; padding: 11px; border-radius: 52px; background: #1f1810; transform: rotate(4deg); box-shadow: 0 40px 80px rgba(120, 60, 0, .35); }
  .phone img { display: block; width: 100%; border-radius: 42px; }
</style></head><body>
  <div class="blob b1"></div><div class="blob b2"></div>
  <img class="logo" src="../public/brand/logo.svg" alt="MyTiffin">
  <h1>Know exactly how many tiffins to <em>cook today.</em></h1>
  <p>Customers, deliveries, leave and reports in one simple app.</p>
  <div class="url">mytiffin.online</div>
  <div class="phone"><img src="../promo/assets/today.png" alt=""></div>
</body></html>
